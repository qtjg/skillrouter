<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">SkillRouter adaptive capability routing</title>
  <desc id="desc">A task enters a layered scoring router, which selects among capabilities and feeds the outcome back into learning metrics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#101b32"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#14243b"/><stop offset="1" stop-color="#0b1528"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#60a5fa"/></marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#29405d" stroke-opacity=".28"/></pattern>
  </defs>
  <rect width="960" height="520" rx="28" fill="url(#bg)"/>
  <rect x="24" y="24" width="912" height="472" rx="22" fill="url(#grid)"/>
  <g font-family="Inter,ui-sans-serif,system-ui" fill="#dbeafe">
    <text x="64" y="70" font-size="14" letter-spacing="3" fill="#7dd3fc">ADAPTIVE CAPABILITY ROUTING</text>
    <text x="64" y="110" font-size="30" font-weight="700">Task in. Better route out.</text>
    <text x="64" y="140" font-size="15" fill="#94a3b8">Strategy · reliability · cost · latency · context · trust</text>
  </g>
  <g stroke="#60a5fa" stroke-width="2" fill="none" marker-end="url(#arrow)" filter="url(#glow)">
    <path d="M480 190V222"/><path d="M480 350V386"/><path d="M300 286H238"/><path d="M480 430V464"/><path d="M620 286H680"/>
  </g>
  <g font-family="Inter,ui-sans-serif,system-ui" text-anchor="middle">
    <g><rect x="380" y="155" width="200" height="50" rx="12" fill="#102846" stroke="#38bdf8"/><text x="480" y="185" fill="#e0f2fe" font-size="16" font-weight="700">TASK</text></g>
    <g><path d="M300 245L480 215L660 245L480 275Z" fill="#183556" stroke="#38bdf8"/><path d="M300 245V310L480 342V275Z" fill="#10233c" stroke="#2563eb"/><path d="M660 245V310L480 342V275Z" fill="#142d4b" stroke="#2563eb"/><text x="480" y="267" fill="#e0f2fe" font-size="17" font-weight="700">ROUTER</text><text x="480" y="292" fill="#93c5fd" font-size="12">scoring + constraints + strategy</text></g>
    <g><rect x="356" y="390" width="248" height="54" rx="12" fill="url(#panel)" stroke="#818cf8"/><text x="480" y="413" fill="#c7d2fe" font-size="15" font-weight="700">SELECTED CAPABILITY</text><text x="480" y="432" fill="#94a3b8" font-size="11">activate · explain · audit</text></g>
    <g><rect x="393" y="468" width="174" height="30" rx="10" fill="#123326" stroke="#34d399"/><text x="480" y="489" fill="#bbf7d0" font-size="13" font-weight="700">OUTCOME → LEARN</text></g>
    <g><rect x="70" y="258" width="168" height="56" rx="12" fill="#182439" stroke="#64748b"/><text x="154" y="282" fill="#cbd5e1" font-size="14" font-weight="700">FALLBACK CHAIN</text><text x="154" y="301" fill="#94a3b8" font-size="11">recover without loops</text></g>
    <g><rect x="680" y="258" width="210" height="56" rx="12" fill="#211b3b" stroke="#a78bfa"/><text x="785" y="282" fill="#ddd6fe" font-size="14" font-weight="700">CAPABILITIES</text><text x="785" y="301" fill="#c4b5fd" font-size="11">skills · plugins · MCP · tools</text></g>
  </g>
</svg>
