<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc"><title id="title">SkillRouter reliability learning loop</title><desc id="desc">Execution outcomes update bounded metrics, which become historical reliability signals for future routing decisions.</desc><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#151827"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#60a5fa"/></marker></defs><rect width="960" height="390" rx="26" fill="url(#b)"/><g font-family="Inter,system-ui,sans-serif"><text x="55" y="60" fill="#7dd3fc" font-size="14" letter-spacing="3">OUTCOME-DRIVEN ROUTING</text><text x="55" y="92" fill="#e2e8f0" font-size="27" font-weight="700">Every result becomes evidence.</text><g stroke="#60a5fa" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M185 185H265"/><path d="M385 185H465"/><path d="M585 185H665"/><path d="M785 185V310H127V255"/></g><g text-anchor="middle"><g><rect x="65" y="150" width="120" height="70" rx="12" fill="#102846" stroke="#38bdf8"/><text x="125" y="180" fill="#e0f2fe" font-size="15" font-weight="700">EXECUTION</text><text x="125" y="201" fill="#93c5fd" font-size="11">route + runtime</text></g><g><rect x="265" y="150" width="120" height="70" rx="12" fill="#172b35" stroke="#2dd4bf"/><text x="325" y="180" fill="#ccfbf1" font-size="15" font-weight="700">OUTCOME</text><text x="325" y="201" fill="#99f6e4" font-size="11">success / failure</text></g><g><rect x="465" y="150" width="120" height="70" rx="12" fill="#172554" stroke="#818cf8"/><text x="525" y="180" fill="#c7d2fe" font-size="15" font-weight="700">METRICS</text><text x="525" y="201" fill="#a5b4fc" font-size="11">bounded observations</text></g><g><rect x="665" y="150" width="120" height="70" rx="12" fill="#123326" stroke="#34d399"/><text x="725" y="180" fill="#bbf7d0" font-size="15" font-weight="700">RELIABILITY</text><text x="725" y="201" fill="#86efac" font-size="11">historical signal</text></g></g><g fill="#94a3b8" font-size="13"><text x="120" y="350">future score</text><text x="355" y="350">stats + learn</text><text x="605" y="350">fresh metrics take precedence</text><text x="820" y="350">MAX 1,000 retained observations</text></g></g></svg>
