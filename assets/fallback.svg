<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc"><title id="title">SkillRouter fallback chains</title><desc id="desc">A primary capability can move through an ordered fallback chain after failure, while attempted-set protection and a maximum step cap prevent loops.</desc><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#151827"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#60a5fa"/></marker></defs><rect width="960" height="360" rx="26" fill="url(#b)"/><g font-family="Inter,system-ui,sans-serif"><text x="55" y="60" fill="#7dd3fc" font-size="14" letter-spacing="3">FAILURE-AWARE RECOVERY</text><text x="55" y="92" fill="#e2e8f0" font-size="27" font-weight="700">Recover gracefully. Never retry blindly.</text><g stroke="#60a5fa" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M185 180H265"/><path d="M385 180H465"/><path d="M585 180H665"/><path d="M785 180H865"/></g><g text-anchor="middle"><g><rect x="70" y="145" width="115" height="70" rx="12" fill="#211b3b" stroke="#a78bfa"/><text x="127" y="176" fill="#ede9fe" font-size="15" font-weight="700">PRIMARY</text><text x="127" y="197" fill="#c4b5fd" font-size="11">attempted</text></g><g><rect x="265" y="145" width="120" height="70" rx="12" fill="#172b35" stroke="#2dd4bf"/><text x="325" y="176" fill="#ccfbf1" font-size="15" font-weight="700">FALLBACK 1</text><text x="325" y="197" fill="#99f6e4" font-size="11">ordered</text></g><g><rect x="465" y="145" width="120" height="70" rx="12" fill="#172b35" stroke="#2dd4bf"/><text x="525" y="176" fill="#ccfbf1" font-size="15" font-weight="700">FALLBACK 2</text><text x="525" y="197" fill="#99f6e4" font-size="11">available</text></g><g><rect x="665" y="145" width="120" height="70" rx="12" fill="#123326" stroke="#34d399"/><text x="725" y="176" fill="#bbf7d0" font-size="15" font-weight="700">RESULT</text><text x="725" y="197" fill="#86efac" font-size="11">continue</text></g><g><rect x="865" y="145" width="70" height="70" rx="12" fill="#1e293b" stroke="#64748b"/><text x="900" y="172" fill="#e2e8f0" font-size="12" font-weight="700">STOP</text><text x="900" y="191" fill="#cbd5e1" font-size="10">cap</text></g></g><g fill="#94a3b8" font-size="13"><text x="88" y="275">Declared per capability</text><text x="305" y="275">Attempted-set loop protection</text><text x="600" y="275">maxSteps bounds traversal</text><text x="802" y="275">events + learned suggestions</text></g></g></svg>
