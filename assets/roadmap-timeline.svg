<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">SkillRouter roadmap timeline</title><desc id="desc">Phases 1 through 7 and context and intent milestones are implemented; runtime, embedding, marketplace, sandboxing, signing, and CI/CD remain future work.</desc><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#151827"/></linearGradient></defs><rect width="960" height="430" rx="26" fill="url(#b)"/><g font-family="Inter,system-ui,sans-serif"><text x="55" y="60" fill="#7dd3fc" font-size="14" letter-spacing="3">IMPLEMENTATION ROADMAP</text><text x="55" y="92" fill="#e2e8f0" font-size="27" font-weight="700">Built in public. Deliberately scoped.</text><line x1="90" y1="175" x2="870" y2="175" stroke="#334155" stroke-width="4"/><g text-anchor="middle"><g fill="#34d399" stroke="#34d399"><circle cx="120" cy="175" r="12"/><circle cx="250" cy="175" r="12"/><circle cx="380" cy="175" r="12"/><circle cx="510" cy="175" r="12"/><circle cx="640" cy="175" r="12"/><circle cx="770" cy="175" r="12"/></g><g fill="#bbf7d0" font-size="13" font-weight="700"><text x="120" y="145">FOUNDATION</text><text x="250" y="145">CAPABILITIES</text><text x="380" y="145">ROUTING</text><text x="510" y="145">SECURITY</text><text x="640" y="145">RELIABILITY</text><text x="770" y="145">CONTEXT + INTENT</text></g><g fill="#94a3b8" font-size="11"><text x="120" y="205">done</text><text x="250" y="205">done</text><text x="380" y="205">done</text><text x="510" y="205">done</text><text x="640" y="205">done</text><text x="770" y="205">done</text></g></g><g fill="#cbd5e1" font-size="14"><text x="80" y="270" fill="#7dd3fc" font-weight="700">NEXT / FUTURE</text><text x="80" y="300">Runtime daemon · embedding matcher · learning rank signals · publishing / registry API</text><text x="80" y="328">Marketplace · sandboxing · Ed25519 capability signing · MCP server mode · CI/CD action</text></g><rect x="80" y="350" width="800" height="40" rx="12" fill="#1e293b" stroke="#475569"/><text x="480" y="375" text-anchor="middle" fill="#cbd5e1" font-size="13">Roadmap claims are intentionally separated from the current implementation.</text></g></svg>
