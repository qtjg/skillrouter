<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">SkillRouter routing strategies</title><desc id="desc">Six implemented strategy presets surround a central router: balanced, quality, speed, cheap, minimal, and safe.</desc><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#17152d"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="960" height="460" rx="26" fill="url(#b)"/><g font-family="Inter,system-ui,sans-serif"><text x="55" y="62" fill="#7dd3fc" font-size="14" letter-spacing="3">STRATEGY-AWARE ROUTING</text><text x="55" y="94" fill="#e2e8f0" font-size="28" font-weight="700">Choose the trade-off. Keep the engine.</text><g stroke="#64748b" stroke-width="2" stroke-dasharray="5 7" opacity=".8"><path d="M480 240L220 145M480 240L480 135M480 240L740 145M480 240L220 350M480 240L480 365M480 240L740 350"/></g><g text-anchor="middle"><g filter="url(#glow)"><circle cx="480" cy="240" r="76" fill="#102846" stroke="#38bdf8" stroke-width="2"/><text x="480" y="235" fill="#e0f2fe" font-size="18" font-weight="700">ROUTER</text><text x="480" y="258" fill="#93c5fd" font-size="12">same signals</text></g><g><circle cx="220" cy="145" r="52" fill="#172b35" stroke="#2dd4bf"/><text x="220" y="142" fill="#ccfbf1" font-size="15" font-weight="700">QUALITY</text><text x="220" y="161" fill="#99f6e4" font-size="11">reliability first</text></g><g><circle cx="480" cy="135" r="52" fill="#172554" stroke="#818cf8"/><text x="480" y="132" fill="#c7d2fe" font-size="15" font-weight="700">SPEED</text><text x="480" y="151" fill="#a5b4fc" font-size="11">latency first</text></g><g><circle cx="740" cy="145" r="52" fill="#211b3b" stroke="#a78bfa"/><text x="740" y="142" fill="#ede9fe" font-size="15" font-weight="700">CHEAP</text><text x="740" y="161" fill="#c4b5fd" font-size="11">cost first</text></g><g><circle cx="220" cy="350" r="52" fill="#1e293b" stroke="#64748b"/><text x="220" y="347" fill="#e2e8f0" font-size="15" font-weight="700">MINIMAL</text><text x="220" y="366" fill="#cbd5e1" font-size="11">low overhead</text></g><g><circle cx="480" cy="365" r="52" fill="#123326" stroke="#34d399"/><text x="480" y="362" fill="#bbf7d0" font-size="15" font-weight="700">SAFE</text><text x="480" y="381" fill="#86efac" font-size="11">risk-aware</text></g><g><circle cx="740" cy="350" r="52" fill="#14263d" stroke="#60a5fa"/><text x="740" y="347" fill="#dbeafe" font-size="15" font-weight="700">BALANCED</text><text x="740" y="366" fill="#93c5fd" font-size="11">default trade-off</text></g></g></g></svg>
