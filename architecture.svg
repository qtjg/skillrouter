<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">SkillRouter current architecture</title><desc id="desc">The implemented pipeline moves from task and project context through candidate discovery, scoring, planning, runtime adapters, audit history, and metrics.</desc><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#111827"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#60a5fa"/></marker><pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#29405d" stroke-opacity=".25"/></pattern></defs><rect width="960" height="620" rx="26" fill="url(#b)"/><rect x="20" y="20" width="920" height="580" rx="20" fill="url(#g)"/><g font-family="Inter,system-ui,sans-serif"><text x="55" y="63" fill="#7dd3fc" font-size="14" letter-spacing="3">CURRENT IMPLEMENTATION</text><text x="55" y="95" fill="#e2e8f0" font-size="28" font-weight="700">From task signal to audited activation</text><g stroke="#60a5fa" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M480 145V180"/><path d="M480 247V282"/><path d="M480 349V384"/><path d="M480 451V486"/><path d="M650 316H765"/><path d="M835 360V510H650"/></g><g text-anchor="middle"><g><rect x="350" y="112" width="260" height="55" rx="12" fill="#102846" stroke="#38bdf8"/><text x="480" y="145" fill="#e0f2fe" font-size="16" font-weight="700">TASK + PROJECT + GIT CONTEXT</text></g><g><rect x="335" y="180" width="290" height="67" rx="12" fill="#14263d" stroke="#60a5fa"/><text x="480" y="207" fill="#dbeafe" font-size="15" font-weight="700">CANDIDATE CATALOG</text><text x="480" y="228" fill="#94a3b8" font-size="12">discover · manifest · graph · dependencies</text></g><g><rect x="325" y="282" width="310" height="67" rx="12" fill="#211b3b" stroke="#a78bfa"/><text x="480" y="309" fill="#ede9fe" font-size="15" font-weight="700">SCORING + CONSTRAINTS</text><text x="480" y="330" fill="#c4b5fd" font-size="12">intent · context · trust · cost · latency · history</text></g><g><rect x="350" y="384" width="260" height="67" rx="12" fill="#172b35" stroke="#2dd4bf"/><text x="480" y="411" fill="#ccfbf1" font-size="15" font-weight="700">PLAN + EXPLAIN</text><text x="480" y="432" fill="#99f6e4" font-size="12">activate · keep · deactivate · fallback</text></g><g><rect x="350" y="486" width="260" height="67" rx="12" fill="#123326" stroke="#34d399"/><text x="480" y="513" fill="#bbf7d0" font-size="15" font-weight="700">RUNTIME + ADAPTERS</text><text x="480" y="534" fill="#86efac" font-size="12">consent · lifecycle · agent integration</text></g><g><rect x="765" y="282" width="140" height="78" rx="12" fill="#1e293b" stroke="#64748b"/><text x="835" y="313" fill="#e2e8f0" font-size="14" font-weight="700">AUDIT</text><text x="835" y="335" fill="#94a3b8" font-size="12">history + logs</text></g><g><rect x="485" y="510" width="330" height="68" rx="12" fill="#172554" stroke="#818cf8"/><text x="650" y="538" fill="#c7d2fe" font-size="15" font-weight="700">METRICS + LEARNING</text><text x="650" y="558" fill="#a5b4fc" font-size="12">bounded observations → future ranking</text></g></g></g></svg>
